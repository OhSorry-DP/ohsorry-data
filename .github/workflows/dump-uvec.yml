name: dump-uvec
on:
  schedule:
    - cron: '20,50 * * * *'
  workflow_dispatch:
concurrency: { group: dump-uvec, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/dump-uvec.mjs ${{ github.event_name == 'schedule' && '--apply' || '' }}
