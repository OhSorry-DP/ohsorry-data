name: dump-user

# vercel 함수(api/dump-trigger)가 보내는 repository_dispatch(dump-user) 로 기동.
# client_payload.iidx_id 유저를 supabase 에서 재덤프 → **R2 PUT 만** 한다.
#
# ⚠️ git 데이터 커밋은 2026-08-09 중단했다(CF 통합 §4). 종전엔 유저당 1일 1회 커밋해 이력·롤백
#    원본을 git 이 들고 있었는데, .git 이 219.7MB / 커밋 13,571개까지 불었고 계속 늘고 있었다.
#    롤백 수단은 이제 **R2 스냅샷**(§2, 일별 30 + 월별 12)이 맡는다 — hist 가 무손실(§1)이라
#    오히려 복원력이 낫다. 기존 git 이력은 지우지 않는다(더 늘지 않을 뿐).
#    → 이 워크플로에는 더 이상 git 쓰기가 없고, repo 는 코드 전용이다.
on:
  repository_dispatch:
    types: [dump-user]

# 같은 유저 연속 업로드는 마지막 것만(이전 실행 취소). 다른 유저는 병렬.
concurrency:
  group: dump-${{ github.event.client_payload.iidx_id }}
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    # §4 로 git 쓰기가 사라져 write 권한이 필요 없다 — 최소 권한으로 낮춘다.
    permissions:
      contents: read
    # iidx_id 는 외부(supabase record) 유래 → 쉘에 직접 보간하지 말고 env 경유(인젝션 방지).
    env:
      IIDX_ID: ${{ github.event.client_payload.iidx_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # persona/spPersona 산출 실패 시 기존값 보존에 쓸 현재 유저 덤프.
      - name: R2 user 현재본 받기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
        run: |
          mkdir -p user
          F="user/$IIDX_ID.json"
          R2_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/ohsorry-data/objects"
          get_r2() {
            local key="$1" out="$2" status
            if ! status=$(curl -sS -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$R2_URL/$key"); then
              rm -f "$out"; echo "::warning::R2 다운로드 전송 실패: $key"; return 1
            fi
            case "$status" in
              2??) return 0 ;;
              404) rm -f "$out"; return 1 ;;
              *) rm -f "$out"; echo "::warning::R2 다운로드 실패(HTTP $status): $key"; return 1 ;;
            esac
          }
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            get_r2 "$F" "$F" || :
          fi

      # hist(무손실 점수 이력) 현재본을 R2 에서 미리 받아둔다.
      #   덤프 스크립트가 이걸 (행수, 최신 date) 프로브와 대조해 **변경이 없으면 scores 전체 재조회를 건너뛴다.**
      #   webhook 은 users.date 갱신만으로도 발화하므로(INF 15분 자동동기화) 점수가 안 바뀐 회차가 많은데,
      #   매번 전체를 읽으면 덤프 1회 supabase 읽기가 +94% 늘어난다(실측 2026-08-09).
      #   취득 실패는 무해 — 파일이 없으면 전체 재생성으로 떨어진다(정확성은 그쪽이 상위).
      #   ⚠️ hist 는 git 에 없다(.gitignore) — R2 가 유일한 보관처이므로 베이스도 R2 에서 받는다.
      - name: R2 hist 현재본 받기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
        run: |
          mkdir -p hist
          F="hist/$IIDX_ID.json"
          R2_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/ohsorry-data/objects"
          get_r2() {
            local key="$1" out="$2" status
            if ! status=$(curl -sS -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$R2_URL/$key"); then
              rm -f "$out"; echo "::warning::R2 다운로드 전송 실패: $key"; return 1
            fi
            case "$status" in
              2??) return 0 ;;
              404) rm -f "$out"; return 1 ;;
              *) rm -f "$out"; echo "::warning::R2 다운로드 실패(HTTP $status): $key"; return 1 ;;
            esac
          }
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 미설정 — hist 전체 재생성"; exit 0
          fi
          if get_r2 "$F" "$F" \
             && node -e 'const a=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(!Array.isArray(a)||!a.length)process.exit(1);console.log("hist 베이스 = R2 현재본 ("+a.length+"행)")' "$F" 2>/dev/null; then
            :
          else
            rm -f "$F"; echo "R2 hist 없음/무효 — 전체 생성"
          fi

      - name: Dump user from supabase
        id: dump
        # 🔴 CLOUDFLARE_* 는 필수다 — 덤프 스크립트가 persona/spPersona 보존을 위해
        #   **R2 에서 이전 덤프를 직접 읽는다**(로컬 user/ 폴더는 2026-09-04 에 git 추적을 끊어 없다).
        #   빠뜨리면 r2-client 가 wrangler 폴백으로 내려가 Actions 에서 인증 없이 실패하고,
        #   호출부가 그걸 "신규 유저" 로 오인해 **보존 장치가 통째로 무력화된다.**
        #   실사고(2026-09-04) — 기존 유저 전원이 매 덤프마다 '이전 덤프 없음' 으로 찍히고 있었다.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
        run: node .github/scripts/dump-user.mjs "$IIDX_ID"

      # 신곡 누락 시에만 공통 생성기로 갱신. 실패해도 병합·유저/이력 업로드를 계속한다.
      - name: 누락 신곡 확인 및 songs.json 갱신
        if: ${{ !cancelled() && steps.dump.outcome == 'success' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
        run: node .github/scripts/refresh-missing-songs.mjs "$IIDX_ID"

      - name: users-list 증분 병합 + R2 반영 (GET→PUT→검증→재시도)
        # 이 유저 1명을 전 유저 목록에 즉시 반영한다(신규 유저가 목록에 한참 안 보이던 문제 해소).
        #   전체 정합성(삭제 유저 정리·증분 누락 복구)은 dump-users-list 의 1일 1회 전체 재생성이 담당.
        #
        # ⚠️ GET/PUT 을 **스크립트가 직접** 한다 (2026-08-14 변경).
        #   종전에는 이 스텝에서 GET 하고 한참 뒤 "Upload to R2" 스텝에서 PUT 해서 레이스 창이
        #   수십 초로 벌어져 있었다. read-modify-write 라 그 사이 다른 실행이 PUT 하면 덮인다.
        #   별값 백필로 386명을 한꺼번에 UPDATE 하자 webhook 386개가 동시에 돌며
        #   **users-list 의 40.3%(253명 중 102명)가 옛 값으로 덮였다.**
        #   → 스크립트가 GET→merge→PUT 을 붙여서 창을 최소화하고, PUT 뒤 다시 읽어 검증한 뒤
        #     덮였으면 지수 백오프+지터로 최대 5회 재시도한다.
        #   (현재 R2 REST 경로에는 조건부 PUT 을 쓰지 않아 낙관적 잠금을 쓸 수 없다. 검증-재시도가 차선.)
        #
        # 베이스는 **R2 현재본**이다 — git 데이터 커밋을 중단해 R2 가 유일본이 됐다.
        #   HTTP(data.iidx.in) 대신 R2 REST 직접 읽기인 이유: Worker 엣지 캐시(60초)를 우회해야
        #   하는데 쿼리 cache-bust 가 안 통한다(캐시 키에서 쿼리를 버림 — cf/src/index.js).
        #   R2 원본 직접 읽기는 read-after-write 강한 일관성이라 방금 다른 실행이 올린 것도 보인다.
        #
        # ⚠️ 취득/검증 실패 시 **중단한다.** 빈·깨진 베이스로 PUT 하면 전 유저 목록이 통째로 날아간다.
        #   중단해도 서빙은 멀쩡하다 — R2 의 기존 users-list.json 이 그대로 남고, 이 유저의 user/·hist/ 는
        #   다음 스텝이 올린다. 목록 반영만 1일 1회 전체 재생성으로 밀린다.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 미설정 — users-list 병합 불가"; exit 1
          fi
          node .github/scripts/merge-user-into-list.mjs "user/$IIDX_ID.json"

      - name: Upload to R2 (data.iidx.in)
        # 서빙 = R2(cf/ Worker → data.iidx.in). **§4 이후 R2 가 유일본이다**(git 데이터 커밋 중단).
        #   종전 jsdelivr purge 를 대체 — `@main` 별칭 해석 캐시(12h)를 purge API 로는 못 풀어
        #   push 직후 purge 가 구본을 12h 고착시키는 사고가 두 번 났다(2026-07-17 / 2026-08-04).
        #   R2 는 별칭 개념이 없어 PUT 즉시 반영이고, 캐시 정책도 Worker 가 쥔다.
        #
        # ⚠️ 조건이 "덤프 성공"뿐인 것은 의도다 — 앞 스텝(users-list 병합)이 실패해도 이 유저의
        #   user/·hist/ 는 올라가야 한다. 목록 반영만 늦어지고 카드 자체는 최신이 된다.
        #   (users-list.json 은 병합이 중단되면 파일이 없을 수 있어 아래에서 존재 확인 후 PUT 한다.)
        if: ${{ !cancelled() && steps.dump.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 미설정 — R2 업로드 skip"; exit 0
          fi
          # 한쪽이 실패해도 다른 쪽은 반드시 시도한 뒤, 하나라도 실패했으면 스텝을 실패로 끝낸다.
          #   (종전 `... || { echo warning; return 1; }` 은 기본 셸 `bash -e` 의 errexit 에 걸려
          #    첫 실패에서 스텝이 죽고 users-list.json PUT 이 아예 실행되지 않았다.)
          rc=0
          R2_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/ohsorry-data/objects"
          put() {
            local status
            if status=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                 -H "Content-Type: application/json; charset=utf-8" --data-binary "@$1" "$R2_URL/$1") \
               && [[ "$status" == 2?? ]]; then
              echo "R2 OK: $1"
            else
              echo "::error::R2 업로드 실패: $1"; rc=1
            fi
          }
          # dirty 마커를 먼저 PUT해야 취소된 실행에서도 다음 비교 기준이 새 값으로 덮이지 않는다.
          # 마커 PUT 실패는 rc=1로 기록하되 user PUT은 계속 — 일일 대조가 복구한다.
          for f in ranking-state/dirty/*.json; do [ -f "$f" ] && put "$f"; done
          put "user/$IIDX_ID.json"
          # users-list.json 은 여기서 PUT 하지 않는다 — 앞 스텝의 merge 스크립트가 GET→PUT→검증까지
          #   담당한다(레이스 창 최소화, 2026-08-14). 여기서 또 올리면 검증을 통과한 최신본을
          #   이 잡의 낡은 로컬 사본으로 되돌려버린다.
          # hist 도 R2 PUT 이 유일한 보관 경로다. 변경이 없어 재생성을 건너뛴 회차도 그대로 다시
          #   올린다(내용 동일 · ingress 무료 · Class A 는 월 100만 중 하루 70여 회).
          if [ -f "hist/$IIDX_ID.json" ]; then put "hist/$IIDX_ID.json"; else echo "::warning::hist 파일 없음 — PUT skip"; fi
          exit $rc

      # 본체 PUT을 먼저 끝낸다. slice 실패는 경고·실패 outcome으로 남기고 본 덤프와 격리한다.
      - name: uslice 증분 PUT 및 빈 shard DELETE
        if: ${{ !cancelled() && steps.dump.outcome == 'success' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::R2 토큰 없음 — slice 실패"; exit 1
          fi
          node .github/scripts/user-slice.mjs "$IIDX_ID"

  dispatch-coach-user:
    needs: dump
    if: ${{ !cancelled() && needs.dump.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    env:
      IIDX_ID: ${{ github.event.client_payload.iidx_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_API_URL: ${{ github.api_url }}
      SOURCE_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Verify uploaded R2 user and dispatch coach refresh
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';

          const warn = (message) => console.log(`::warning::${message}`);
          const id = process.env.IIDX_ID ?? '';
          if (!/^[A-Za-z0-9_-]{1,64}$/.test(id)) {
            warn('Invalid iidx_id; coach refresh dispatch skipped');
            process.exit(0);
          }
          if (!process.env.CLOUDFLARE_API_TOKEN) {
            warn('R2 token missing; coach refresh dispatch skipped');
            process.exit(0);
          }
          if (!process.env.GITHUB_TOKEN) {
            warn('GitHub token missing; coach refresh dispatch skipped');
            process.exit(0);
          }

          try {
            const key = `user/${id}.json`;
            const r2Url = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/r2/buckets/ohsorry-data/objects/${key}`;
            const r2 = await fetch(r2Url, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              signal: AbortSignal.timeout(5000),
            });
            if (!r2.ok) {
              warn(`R2 verification failed (HTTP ${r2.status}); coach refresh dispatch skipped`);
              process.exit(0);
            }
            const bytes = Buffer.from(await r2.arrayBuffer());
            let user;
            try { user = JSON.parse(bytes.toString('utf8')); }
            catch {
              warn('R2 user JSON invalid; coach refresh dispatch skipped');
              process.exit(0);
            }
            // 덤프의 유저 ID 는 최상위가 아니라 user.iidx_id 에 있다.
            if (String(user?.user?.iidx_id ?? '') !== id ||!['string', 'number'].includes(typeof user?._v)
              || (typeof user._v === 'string' && user._v.length === 0)
              || (typeof user._v === 'number' && !Number.isFinite(user._v))) {
              warn('R2 user identity or version invalid; coach refresh dispatch skipped');
              process.exit(0);
            }
            const expectedV = user._v;
            const sha256 = createHash('sha256').update(bytes).digest('hex');
            if (!/^[a-f0-9]{64}$/.test(sha256)) {
              warn('R2 user hash invalid; coach refresh dispatch skipped');
              process.exit(0);
            }

            const [owner, repo] = (process.env.GITHUB_REPOSITORY ?? '').split('/');
            if (!owner || !repo) {
              warn('GitHub repository unavailable; coach refresh dispatch skipped');
              process.exit(0);
            }
            const apiUrl = process.env.GITHUB_API_URL || 'https://api.github.com';
            const response = await fetch(`${apiUrl}/repos/${owner}/${repo}/dispatches`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({ event_type: 'refresh-coach-user', client_payload: {
                iidx_id: id, expected_v: expectedV, source_run_id: process.env.SOURCE_RUN_ID,
              } }),
              signal: AbortSignal.timeout(5000),
            });
            if (response.status !== 204) {
              warn(`Coach refresh dispatch failed (HTTP ${response.status})`);
              process.exit(0);
            }
            console.log('Coach refresh dispatch accepted');
          } catch (error) {
            warn(error?.name === 'TimeoutError' || error?.name === 'AbortError'
              ? 'R2 verification or coach refresh dispatch timed out'
              : 'R2 verification or coach refresh dispatch failed');
            process.exit(0);
          }
          JS
