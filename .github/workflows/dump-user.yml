name: dump-user

# vercel 함수(api/dump-trigger)가 보내는 repository_dispatch(dump-user) 로 기동.
# client_payload.iidx_id 유저를 supabase 에서 재덤프 → user/{id}.json commit/push → jsdelivr purge.
on:
  repository_dispatch:
    types: [dump-user]

# 같은 유저 연속 업로드는 마지막 것만(이전 실행 취소). 다른 유저는 병렬.
concurrency:
  group: dump-${{ github.event.client_payload.iidx_id }}
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # iidx_id 는 외부(supabase record) 유래 → 쉘에 직접 보간하지 말고 env 경유(인젝션 방지).
    env:
      IIDX_ID: ${{ github.event.client_payload.iidx_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dump user from supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/dump-user.mjs "$IIDX_ID"

      - name: Commit & push
        run: |
          if [ -z "$(git status --porcelain user/)" ]; then echo "변경 없음 — skip"; exit 0; fi
          git config user.name "ohsorry-bot"
          git config user.email "hanekawa4365@gmail.com"
          # 산출물을 임시 보관 — push 충돌 시 origin 최신 위에 재적용.
          #   users-list.json 은 단일 라인 JSON 이라 rebase 로는 병합 불가 → 매 시도마다
          #   origin/main 으로 reset 후 유저 파일 복원 + 목록 재병합으로 충돌 자체를 회피.
          cp "user/$IIDX_ID.json" /tmp/dump-user-artifact.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dump-user-artifact.json "user/$IIDX_ID.json"
            # 유저 목록에도 즉시 병합 — dump-users-list cron 이 GitHub 스로틀로 1~3시간
            # 밀려 신규 유저가 목록에 안 보이던 문제 해소(cron 은 전체 정합성 보정용 유지).
            node .github/scripts/merge-user-into-list.mjs "user/$IIDX_ID.json"
            if [ -z "$(git status --porcelain)" ]; then echo "변경 없음 — skip"; exit 0; fi
            git add user/ users-list.json
            git commit -m "auto dump: $IIDX_ID"
            git push && exit 0
            echo "push 재시도 $i"; sleep 3
          done
          echo "push 실패"; exit 1

      - name: Upload to R2 (data.iidx.in)
        # 서빙은 R2(cf/ Worker → data.iidx.in). git 은 이력·롤백용 원본으로 남긴다.
        #   종전 jsdelivr purge 를 대체 — `@main` 별칭 해석 캐시(12h)를 purge API 로는 못 풀어
        #   push 직후 purge 가 구본을 12h 고착시키는 사고가 두 번 났다(2026-07-17 / 2026-08-04).
        #   R2 는 별칭 개념이 없어 PUT 즉시 반영이고, 캐시 정책도 Worker 가 쥔다.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 미설정 — R2 업로드 skip(덤프·push 는 정상)"; exit 0
          fi
          put() {
            npx --yes wrangler@4 r2 object put "ohsorry-data/$1" --file="$1" \
              --content-type="application/json; charset=utf-8" --remote || {
                echo "::warning::R2 업로드 실패: $1"; return 1; }
            echo "R2 OK: $1"
          }
          put "user/$IIDX_ID.json"
          put "users-list.json"
