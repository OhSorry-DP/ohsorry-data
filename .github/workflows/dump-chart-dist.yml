name: dump-chart-dist
# 목적: 곡 상세 §17 실력대 분포 공개 파일을 생성한다. 원천은 R2 전용이며 Supabase는 읽지 않는다. 03:05 users-list 재생성과 03:20 ranking 전체 대조 뒤 실행한다.
on:
  schedule:
    - cron: '35 18 * * *' # UTC 18:35 = KST 03:35
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        required: false
      sp_clear_map_initial:
        type: boolean
        default: false
        required: false
concurrency: { group: dump-chart-dist, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: distribution
        run: node .github/scripts/dump-chart-dist.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - id: sp_clear_map
        name: Generate SP clear map
        env:
          SP_CLEAR_MAP_AUTO_PUBLISH: ${{ vars.SP_CLEAR_MAP_AUTO_PUBLISH == 'true' && 'true' || 'false' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node .github/scripts/dump-sp-clear-map.mjs --dry-run
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.sp_clear_map_initial }}" = "true" ]; then
            node .github/scripts/dump-sp-clear-map.mjs --initial
          else
            node .github/scripts/dump-sp-clear-map.mjs
          fi
      - name: Summarize chart distribution and SP clear map
        if: always()
        env:
          DISTRIBUTION_OUTCOME: ${{ steps.distribution.outcome }}
          SP_CLEAR_MAP_OUTCOME: ${{ steps.sp_clear_map.outcome }}
        run: |
          if [ "$DISTRIBUTION_OUTCOME" != "success" ]; then
            echo '분포 성공: 실패' >> "$GITHUB_STEP_SUMMARY"
            echo '표 단계: 앞 단계 실패로 미실행' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SP_CLEAR_MAP_OUTCOME" = "success" ]; then
            echo '분포 성공: 성공' >> "$GITHUB_STEP_SUMMARY"
            echo '표 단계: 성공' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '분포 성공: 성공' >> "$GITHUB_STEP_SUMMARY"
            echo '표 단계: 장애' >> "$GITHUB_STEP_SUMMARY"
          fi
