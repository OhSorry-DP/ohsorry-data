name: dump-chart-dist
# 목적: 곡 상세 §17 실력대 분포 공개 파일을 생성한다. 원천은 R2 전용이며 Supabase는 읽지 않는다. 03:05 users-list 재생성과 03:20 ranking 전체 대조 뒤 실행한다.
on:
  schedule:
    - cron: '35 18 * * *' # UTC 18:35 = KST 03:35
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        required: false
concurrency: { group: dump-chart-dist, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/dump-chart-dist.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
