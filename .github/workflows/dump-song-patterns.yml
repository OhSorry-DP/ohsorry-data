name: dump-song-patterns
# 곡 메타 cron과 엇갈려 패턴 slice를 회당 최대 500건 증분 게시한다.
on:
  schedule:
    - cron: '10,40 * * * *'
  workflow_dispatch: {}
concurrency: { group: dump-song-patterns, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/dump-song-patterns.mjs --max-writes=500 ${{ github.event_name == 'schedule' && '--apply' || '' }}
