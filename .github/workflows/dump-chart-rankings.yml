name: dump-chart-rankings
# 매 실행 R2 REST API로 전체 hist를 읽어 랭킹과 1위를 함께 계산한다. 입력 캐시는 없다.
# observe는 집계/변경 예상 수를 로그에 남기며 공개 PUT/DELETE를 수행하지 않는다.
# dump-users-list.yml 의 1위 생산 제거와 묶어 배포한다. 중간 상태를 운영에 적용하지 않는다.
# publish 활성화 전 구 실행 종료, 1위 중복 작성자 제거, 운영 대조 통과가 필요하다.
# 이 승인은 코드가 자동 추정하지 않는다. mode는 저장소 변수로 명시한다.
# 옛 RPC 와의 대조는 compare-history-rankings.mjs 를 따로 실행한다.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency: { group: dump-chart-rankings, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RANKING_HISTORY_MODE: ${{ vars.RANKING_HISTORY_MODE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/dump-chart-rankings.mjs
