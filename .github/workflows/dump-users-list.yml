name: dump-users-list

# 전 유저 목록(users-list.json) · 곡 마스터(songs.json) 재생성 — 웹 fetchAllUsers·getSongsCache 소스.
#
# 주기가 둘로 갈렸다 (2026-08-06):
#   */30  → **songs.json 만.** 신곡 반영이 늦으면 슬림 row 의 곡메타 조인이 비어 곡명이 안 뜬다.
#           songs 는 거의 안 바뀌므로 아래 "변경 시만 commit" 가드에 걸려 커밋은 잘 안 생긴다.
#   1일 1회 → **users-list.json + songs.json 전체 재생성.** users-list 의 실시간 갱신은 dump-user 가
#           R2 에 증분 병합(merge-user-into-list)으로 담당하고, 여기서는 정합성 보정
#           (삭제 유저 정리 · 증분이 놓친 항목 복구)만 한다.
#   ⚠️ 이 job 이 도는 몇 분 사이 들어온 업로드는 전체 재생성본에 덮일 수 있다(supabase 를 job 시작
#      시점에 읽으므로). 새벽 시간대라 영향이 작고, 다음 dump-user 증분이 복구한다.
#   ⚠️ '*/5' 였을 때 GitHub Actions 스로틀로 실제 1~5시간 간격 실행됨(실측: 04:21→09:10 = 4h49m).
#      고빈도 schedule 일수록 드롭 비율이 높아 오히려 간격이 벌어진다 → 간격을 낮춰 실행률을 높인다.
on:
  schedule:
    - cron: '*/30 * * * *'   # songs.json 만
    - cron: '5 18 * * *'     # 전체 재생성 — UTC 18:05 = KST 03:05
  workflow_dispatch: {}      # 수동 실행은 항상 전체 재생성

concurrency:
  group: dump-users-list
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    # §4 로 git 쓰기가 사라져 write 권한이 필요 없다 — 최소 권한으로 낮춘다.
    permissions:
      contents: read
    env:
      # schedule 문자열로 어느 cron 이 깨웠는지 구분한다(수동 실행이면 빈 값 → 전체).
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 재생성 범위 결정
        run: |
          if [ "$SCHEDULE" = "*/30 * * * *" ]; then
            echo "BUILD_ARGS=--songs"                 >> "$GITHUB_ENV"
            echo "FILES=songs.json"                   >> "$GITHUB_ENV"
            echo "범위: songs.json 만 (30분 주기)"
          else
            echo "BUILD_ARGS="                        >> "$GITHUB_ENV"
            echo "FILES=users-list.json songs.json"   >> "$GITHUB_ENV"
            echo "범위: 전체 재생성 (users-list + songs)"
          fi

      - name: Build
        id: build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # $BUILD_ARGS 는 의도적으로 unquoted — 빈 값이면 인자 없이(전체), '--songs' 면 songs 전용.
        run: node .github/scripts/dump-users-list.mjs $BUILD_ARGS

      - name: Upload to R2 (data.iidx.in)
        # 서빙 = R2(cf/ Worker → data.iidx.in). **§4 이후 R2 가 유일본이다** — git 데이터 커밋을
        #   중단했으므로(2026-08-09) 여기에도 commit/push 스텝이 없다. 롤백은 R2 스냅샷(§2)이 맡는다.
        #   종전 jsdelivr purge 를 대체 — 상세 경위는 dump-user.yml 의 같은 스텝 주석 참고.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 미설정 — R2 업로드 skip(덤프·push 는 정상)"; exit 0
          fi
          # 한쪽이 실패해도 나머지는 반드시 시도한 뒤, 하나라도 실패했으면 스텝을 실패로 끝낸다.
          #   (종전 `... || { echo warning; return 1; }` 은 기본 셸 `bash -e` 의 errexit 에 걸려
          #    첫 실패에서 스텝이 죽고 뒤 파일 PUT 이 아예 실행되지 않았다.)
          rc=0
          R2_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/ohsorry-data/objects"
          put() {
            local status
            if status=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                 -H "Content-Type: application/json; charset=utf-8" --data-binary "@$1" "$R2_URL/$1") \
               && [[ "$status" == 2?? ]]; then
              echo "R2 OK: $1"
            else
              echo "::error::R2 업로드 실패: $1"; rc=1
            fi
          }
          for f in $FILES; do put "$f"; done
          exit $rc
