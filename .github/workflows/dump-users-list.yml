name: dump-users-list

# 전 유저 목록(users-list.json) 주기 재생성 — 웹 fetchAllUsers 의 jsdelivr 소스.
# 유저별 카드(user/{id}.json)는 webhook 실시간, 목록도 webhook 시 해당 유저만 즉시 병합
# (merge-user-into-list.mjs). 이 cron 은 **전체 정합성 보정용**이라 30분 간격(변경 시에만 commit).
#   ⚠️ '*/5' 였을 때 GitHub Actions 스로틀로 실제 1~5시간 간격 실행됨(실측: 04:21→09:10 = 4h49m).
#      고빈도 schedule 일수록 드롭 비율이 높아 오히려 간격이 벌어진다 → 간격을 낮춰 실행률을 높인다.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}   # 수동 실행도 가능

concurrency:
  group: dump-users-list
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build users-list.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/dump-users-list.mjs

      - name: Commit & push (변경 시만)
        run: |
          if [ -z "$(git status --porcelain users-list.json songs.json)" ]; then echo "변경 없음 — skip"; exit 0; fi
          git config user.name "ohsorry-bot"
          git config user.email "hanekawa4365@gmail.com"
          git add users-list.json songs.json
          git commit -m "auto: users-list/songs 갱신"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && break
            echo "push 재시도 $i"; sleep 3
          done

      - name: Upload to R2 (data.iidx.in)
        # 서빙은 R2(cf/ Worker → data.iidx.in). git 은 이력·롤백용 원본으로 남긴다.
        #   종전 jsdelivr purge 를 대체 — 상세 경위는 dump-user.yml 의 같은 스텝 주석 참고.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 미설정 — R2 업로드 skip(덤프·push 는 정상)"; exit 0
          fi
          put() {
            npx --yes wrangler@4 r2 object put "ohsorry-data/$1" --file="$1" \
              --content-type="application/json; charset=utf-8" --remote || {
                echo "::warning::R2 업로드 실패: $1"; return 1; }
            echo "R2 OK: $1"
          }
          put "users-list.json"
          put "songs.json"
