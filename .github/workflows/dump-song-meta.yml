name: dump-song-meta
# R2 원본에서 곡별 메타를 만들며 첫 게시도 회당 500회 쓰기로 나눈다.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: 'R2 변경 적용 (기본 dry-run)'
concurrency: { group: dump-song-meta, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/dump-song-meta.mjs --max-writes=500 ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}
