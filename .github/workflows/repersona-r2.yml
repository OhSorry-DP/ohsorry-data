name: repersona-r2

# R2 서빙본의 persona/spPersona 만 제자리 재생성 (수동 기동, supabase 재조회 0).
#   persona.js / persona-popmean(.sp).json 을 개정한 뒤 **기존 유저에게 즉시 반영**할 때 쓴다.
#   평소엔 유저가 플레이할 때 dump-user 가 알아서 갱신하므로 이 워크플로는 필요 없다.
#
# ⚠️ git → R2 **단순 PUT 금지**. dump-user 는 R2 는 매 덤프마다 / git 은 유저당 1일 1커밋이라
#    R2 가 git 보다 최신일 수 있고, git 본을 올리면 그 유저 점수가 롤백된다.
#    그래서 스크립트가 R2 를 읽어 persona 필드만 갈아끼우고 되쓴다(read-modify-write).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '처리할 최대 유저 수 (스모크용, 비우면 전체)'
        required: false
        default: ''
      only:
        description: '특정 iidx_id 만 (콤마 구분, 비우면 전체)'
        required: false
        default: ''
      dry:
        description: 'true 면 PUT 하지 않고 건수만 집계'
        required: false
        default: 'false'
      coach_only:
        description: 'true 면 persona 대신 coach recommendation 만 생성'
        required: false
        default: 'false'
      concurrency:
        description: '동시 처리 수 (비우면 coach 2 / REST 4 / wrangler 폴백 1). Cloudflare API rate limit 조심'
        required: false
        default: ''

      requests_per_second:
        description: 'coach REST 요청 속도 (기본 3 req/s, 모든 child 합산)'
        required: false
        default: '3'

# 동시에 두 번 돌면 같은 오브젝트를 서로 덮어쓴다 — 직렬화.
concurrency:
  group: repersona-r2
  cancel-in-progress: false

jobs:
  repersona:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repersona on R2
        if: ${{ inputs.coach_only != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
          # §27 A-5 — r2-repersona 가 DP 배치(chart_arrange)를 실행당 1회 전량 조회한다(dump-user.yml 과 같은 시크릿).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 미설정 — R2 접근 불가"; exit 1
          fi
          ARGS=""
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit=${{ inputs.limit }}"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only=${{ inputs.only }}"
          [ "${{ inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          [ -n "${{ inputs.concurrency }}" ] && ARGS="$ARGS --concurrency=${{ inputs.concurrency }}"
          node .github/scripts/r2-repersona.mjs $ARGS

      - name: Precompute coach recommendations
        if: ${{ success() && inputs.coach_only == 'true' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
          COACH_RECS_ENGINE_SHA256: ${{ vars.COACH_RECS_ENGINE_SHA256 }}
          COACH_RECS_PHYS_ENABLED: ${{ vars.COACH_RECS_PHYS_ENABLED }}
          PHYS_MODEL_VERSION: ${{ vars.PHYS_MODEL_VERSION || 'phys-line-v2' }}
          # 코치 사전계산이 Pages 와 같은 물리 버전으로 계산하도록(정책 지문에 들어간다).
          PHYS_LINE_VERSION: ${{ vars.PHYS_LINE_VERSION || 'phys-line-v2' }}
          PHYS_MEAN_VERSION: ${{ vars.PHYS_MEAN_VERSION || 'mean-os-pattern-span-v2' }}
          PHYS_Q_VERSION: ${{ vars.PHYS_Q_VERSION }}
          PHYS_TIME_AXIS_VERSION: ${{ vars.PHYS_TIME_AXIS_VERSION }}
          PHYS_ASSETS_MANIFEST_KEY: ${{ vars.PHYS_ASSETS_MANIFEST_KEY }}
        shell: bash
        run: |
          ARGS="--coach-only"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit=${{ inputs.limit }}"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only=${{ inputs.only }}"
          [ "${{ inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          ARGS="$ARGS --concurrency=${{ inputs.concurrency || '2' }} --requests-per-second=${{ inputs.requests_per_second || '3' }}"
          node .github/scripts/r2-repersona.mjs $ARGS
