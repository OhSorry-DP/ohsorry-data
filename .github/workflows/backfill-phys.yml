name: backfill-phys
on:
  workflow_dispatch:
    inputs:
      limit:
        type: number
        description: 'shard당 처리 수 (0은 shard 전체)'
        default: 0
      shard:
        type: number
        description: '0부터 시작하는 shard 번호 (-1은 전체 matrix)'
        default: -1
      shards:
        type: number
        description: '전체 shard 수 (1..256)'
        default: 2
      dry_run:
        type: boolean
        default: true
      model_version:
        type: string
        description: '처리할 phys line 모델 (v1로 지정하면 기존 모델 사용)'
        default: phys-line-v2
      q_version:
        type: string
        default: q-samehand-2s-v1
      time_axis_version:
        type: string
        default: ta-20261004
permissions: { contents: read }
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: matrix
        env:
          SHARD: ${{ inputs.shard }}
          SHARDS: ${{ inputs.shards }}
          LIMIT: ${{ inputs.limit }}
        with:
          script: |
            const shard = Number(process.env.SHARD);
            const shards = Number(process.env.SHARDS);
            const limit = Number(process.env.LIMIT);
            if (!Number.isInteger(shards) || shards < 1 || shards > 256 ||
                !Number.isInteger(shard) || shard < -1 || shard >= shards ||
                !Number.isSafeInteger(limit) || limit < 0) throw new Error('shard/shards/limit 형식 오류');
            return { shard: shard === -1 ? Array.from({ length: shards }, (_, i) => i) : [shard] };
  backfill:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: backfill-phys-${{ inputs.model_version }}-s${{ matrix.shard }}of${{ inputs.shards }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 607eea1b073bea6747e6e9b76f2d7b41
      LIMIT: ${{ inputs.limit }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ inputs.shards }}
      BACKFILL_GATE_MS: 1000
      DRY_RUN: ${{ inputs.dry_run }}
      MODEL_VERSION: ${{ inputs.model_version }}
      Q_VERSION: ${{ inputs.q_version }}
      TIME_AXIS_VERSION: ${{ inputs.time_axis_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/backfill-phys-run.mjs
