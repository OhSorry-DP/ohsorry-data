name = "ohsorry-data"
main = "src/index.js"
compatibility_date = "2026-06-01"
account_id = "607eea1b073bea6747e6e9b76f2d7b41"

# ── 커스텀 도메인 (data.iidx.in) — wrangler가 DNS·SSL 자동 생성 ──
#    training.iidx.in(ohsorryTraining/cf) 과 같은 방식.
routes = [
  { pattern = "data.iidx.in", custom_domain = true },
]

# ── R2: 유저 덤프 정적 데이터 (user/{id}.json, users-list.json, songs.json, version.json) ──
# 생성: wrangler r2 bucket create ohsorry-data
#   원본(정본)은 이 repo 의 git 이력. R2 는 그 사본을 뿌리는 서빙 계층일 뿐이라
#   덤프 로직 사고 시 복구는 git 에서 한다(R2 는 객체 버저닝 없음).
[[r2_buckets]]
binding = "DATA"
bucket_name = "ohsorry-data"

# ── 동일 IP 연속 접속 감속 (2026-09-24) ──────────────────────────────────────
#   🔴 **막는 장치가 아니라 늦추는 장치다.** 초과해도 429 가 아니라 응답이 늦어질 뿐이다
#      (사유는 src/index.js 의 `throttleDelay` 주석).
#   ⚠️ **콜로(데이터센터)별로 센다.** 전 세계 합계가 아니다.
#   ⚠️ `simple.period` 는 **10 또는 60 만** 허용된다 — 「1초에 N회」는 이 바인딩으로 표현할 수 없다.
#
#   🔴🔴 **한도를 이 아래로 내리지 마라 — 첫 방문자가 걸린다.**
#      실측(2026-09-24): `ohSorryWeb/v3/services/loaders.js` 가 CDN 에서 받는 파일이 **19종**이고
#      상당수가 `Promise.all` 로 **동시에** 나간다. ⇒ **처음 들어온 사람이 화면 하나를 여는 것만으로
#      10초 안에 15~19건**이 나간다. 25 는 그 위에 여유를 둔 값이다.
#      세는 법: loaders.js 에서 _URL 로 끝나는 상수를 유일값으로 세면 된다(2026-09-24 기준 19).
#
#   🔴 **브라우저와 수집기는 *초당 속도* 로는 구별되지 않는다** — 둘 다 몰아서 받는다.
#      갈리는 것은 **지속 여부**다(사람은 읽느라 조용해지고, 수집기는 같은 속도를 유지한다).
#      그래서 짧은 폭발은 봐 주고 **지속되면** 때린다.
#
#   열거 경로만 감속한다. 공용 자산(songs/data/lib)은 감속하지 않는다.
#   🔴 **`[[unsafe.bindings]]` 다 — `[[ratelimit]]` 최상위는 wrangler 가 안 받는다.**
#      2026-09-24 에 실제로 그렇게 올렸다가 **경고 한 줄만 나오고 바인딩이 안 붙은 채 배포됐다**
#      (`Unexpected fields found in top-level field: "ratelimit"` · 바인딩 목록에 DATA 만).
#      ⇒ **배포 뒤 출력의 바인딩 목록에 RL_* 둘이 보이는지 반드시 눈으로 확인하라.**
# 2026-09-26 — RL_STEADY·RL_BURST(공용 자산 포함 전 경로 한도) 제거. 사유는 src/index.js 의 throttleDelay 위 주석.

#   RL_ENUM — 🔴 **열거 경로 전용**(user/ · hist/ · users-list*). **이것이 실제 브레이크다.**
#      사람은 프로필 하나에 1~2건이라 60초에 20건이면 **분당 10명을 열어봐야** 닿는다.
#      수집기는 유저 수만큼 받아야 하므로 즉시 걸리고, 이후 **20건/분**으로 묶인다
#      (유저 200명이면 200/20 ≈ 10분. 공용 자산 한도로는 4.5분이었다).
#   2026-09-26 — 12 → 20 (사용자 결정). 랭킹 모달을 빠르게 넘겨보는 사람이 걸리지 않게 여유를 뒀다.
[[unsafe.bindings]]
name = "RL_ENUM"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 20, period = 60 }
